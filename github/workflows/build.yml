name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android lisanslari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Projeyi hazirla
        run: |
          ls
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$ZIP" ]; then unzip -q "$ZIP"; fi
          D=$(dirname "$(find . -name settings.gradle.kts | head -n1)")
          echo "PROJE=$D" >> $GITHUB_ENV
      - run: cd "$PROJE" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KelimeAvcisi-apk
          path: "**/build/outputs/apk/debug/*.apk"
